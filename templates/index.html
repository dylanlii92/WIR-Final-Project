<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vibely</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="ambient ambient-left"></div>
    <div class="ambient ambient-right"></div>
    <div class="ambient ambient-top"></div>
    <div class="line-art line-art-one"></div>
    <div class="line-art line-art-two"></div>

    <header class="site-header">
        <a href="/" class="site-brand">Vibely</a>
    </header>

    <main class="page">
        <section class="hero">
            <h1>Find your next live music moment</h1>

            <form id="search-form" class="search-box">
                <textarea
                    id="search-input"
                    placeholder="Describe the concert, artist, city, or mood you want..."
                    rows="3"
                    required
                ></textarea>
                <button type="submit" aria-label="Search">→</button>
            </form>
        </section>

        <section id="status" class="status"></section>
        <section id="results" class="results-sections"></section>
        <div class="show-more-wrap">
            <button id="show-more" class="show-more-button" type="button" hidden>
                Show more
            </button>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
